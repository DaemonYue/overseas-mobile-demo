<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 101" width="40" height="40">
  <g fill="none" fill-rule="evenodd" stroke-width="4">
    <circle stroke="#EEE" cx="50" cy="50" r="48"/>
    <circle
      stroke="#000"
      stroke-linecap="round"
      stroke-dasharray="200"
      stroke-dashoffset="60"
      cx="50"
      cy="50"
      r="48"
    >
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 50 50"
        to="360 50 50"
        dur="1.2s"
        repeatCount="indefinite"
      />
    </circle>
  </g>
</svg>